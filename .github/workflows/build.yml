name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Create Android Folder
        run: flutter create . --platforms=android --project-name nabd

      # هذا السطر هو "السحر" الذي سيحل مشكلة الكوتلن
      - name: Update Kotlin Version
        run: sed -i 's/id "org.jetbrains.kotlin.android" version "1.9.0" apply false/id "org.jetbrains.kotlin.android" version "2.0.21" apply false/' android/settings.gradle
        
      - name: Get dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nabd-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk